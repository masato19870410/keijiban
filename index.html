<title>みんなの掲示板</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #eef1f5;
    --surface: #ffffff;
    --hero-from: #0f3a63;
    --hero-to: #14507f;
    --ink: #16233a;
    --ink-soft: #4c5b73;
    --muted: #8592a6;
    --border: #dde3ec;
    --accent: #14507f;
    --accent-strong: #0d3a5f;
    --accent-soft: #e5eef8;
    --danger: #b3492f;
    --shadow: rgba(15, 40, 70, 0.10);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0d1420;
      --surface: #161f2e;
      --hero-from: #0a2540;
      --hero-to: #0f3a5f;
      --ink: #e8edf5;
      --ink-soft: #aeb9cc;
      --muted: #78859c;
      --border: #263145;
      --accent: #5b9bd6;
      --accent-strong: #7fb2e2;
      --accent-soft: #1b2c42;
      --danger: #d97a5f;
      --shadow: rgba(0, 0, 0, 0.35);
    }
  }

  :root[data-theme="dark"] {
    --bg: #0d1420;
    --surface: #161f2e;
    --hero-from: #0a2540;
    --hero-to: #0f3a5f;
    --ink: #e8edf5;
    --ink-soft: #aeb9cc;
    --muted: #78859c;
    --border: #263145;
    --accent: #5b9bd6;
    --accent-strong: #7fb2e2;
    --accent-soft: #1b2c42;
    --danger: #d97a5f;
    --shadow: rgba(0, 0, 0, 0.35);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Noto Sans JP", -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 40px 20px 80px;
  }

  main {
    width: 100%;
    max-width: 640px;
  }

  .hero {
    background: linear-gradient(135deg, var(--hero-from), var(--hero-to));
    border-radius: 20px 20px 0 0;
    padding: 40px 32px 88px;
    text-align: center;
    color: #f2f6fc;
  }

  .hero h1 {
    font-weight: 800;
    font-size: 1.9rem;
    letter-spacing: 0.02em;
    text-wrap: balance;
    margin: 0 0 10px;
  }

  .hero p {
    margin: 0;
    font-size: 0.92rem;
    color: #c7d8ec;
    line-height: 1.6;
  }

  .panel {
    background: var(--surface);
    border-radius: 18px;
    box-shadow: 0 12px 28px var(--shadow);
    margin: -56px 20px 0;
    padding: 24px;
    position: relative;
    z-index: 1;
  }

  .panel h2 {
    font-weight: 700;
    font-size: 1.05rem;
    color: var(--accent);
    margin: 0 0 18px;
  }

  .field {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .field + .field {
    margin-top: 16px;
  }

  label {
    font-size: 0.82rem;
    font-weight: 500;
    color: var(--ink-soft);
  }

  input, textarea {
    width: 100%;
    padding: 11px 14px;
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 0.96rem;
    font-family: inherit;
    background: var(--surface);
    color: var(--ink);
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }

  input::placeholder, textarea::placeholder {
    color: var(--muted);
  }

  input:focus, textarea:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }

  textarea {
    resize: vertical;
    min-height: 84px;
    line-height: 1.55;
  }

  .form-footer {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    margin-top: 16px;
    gap: 12px;
  }

  .char-count {
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.74rem;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    margin-right: auto;
  }

  button {
    padding: 11px 26px;
    background: var(--accent);
    color: #f2f7fc;
    border: none;
    border-radius: 10px;
    font-size: 0.92rem;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    transition: background 0.15s ease;
  }

  button:hover {
    background: var(--accent-strong);
  }

  button:focus-visible, input:focus-visible, textarea:focus-visible, .delete-btn:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .list-panel {
    background: var(--surface);
    border-radius: 18px;
    box-shadow: 0 12px 28px var(--shadow);
    margin: 16px 20px 0;
    padding: 24px;
  }

  .list-heading {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 16px;
  }

  .list-heading h2 {
    font-weight: 700;
    font-size: 1.05rem;
    color: var(--accent);
    margin: 0;
  }

  .list-count {
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.78rem;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }

  #postList {
    display: flex;
    flex-direction: column;
  }

  .post {
    padding: 16px 0;
    border-bottom: 1px solid var(--border);
    animation: rise 0.25s ease;
  }

  .post:last-child {
    border-bottom: none;
    padding-bottom: 0;
  }

  .post:first-child {
    padding-top: 0;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (prefers-reduced-motion: reduce) {
    .post { animation: none; }
  }

  .post-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
    margin-bottom: 6px;
  }

  .post-name {
    font-weight: 700;
    color: var(--accent);
    overflow-wrap: anywhere;
  }

  .post-date {
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.72rem;
    color: var(--muted);
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }

  .post-message {
    white-space: pre-wrap;
    word-break: break-word;
    line-height: 1.65;
    color: var(--ink);
    margin-bottom: 8px;
  }

  .delete-btn {
    background: none;
    border: none;
    color: var(--danger);
    font-size: 0.75rem;
    font-family: inherit;
    cursor: pointer;
    padding: 0;
    opacity: 0.75;
  }

  .delete-btn:hover {
    opacity: 1;
    text-decoration: underline;
  }

  .empty {
    text-align: center;
    color: var(--muted);
    padding: 36px 20px;
    font-size: 0.9rem;
  }

  footer {
    margin-top: 24px;
    text-align: center;
    font-size: 0.75rem;
    color: var(--muted);
  }
</style>

<main>
  <div class="hero">
    <h1>みんなの掲示板</h1>
    <p>名前とひとことを投稿すると、下の一覧に新しい順で表示されます</p>
  </div>

  <div class="panel">
    <h2>投稿する</h2>
    <form id="postForm">
      <div class="field">
        <label for="name">お名前</label>
        <input type="text" id="name" maxlength="30" placeholder="例：たろう">
      </div>
      <div class="field">
        <label for="message">ひとこと</label>
        <textarea id="message" maxlength="500" placeholder="今日できたこと・感想など" required></textarea>
      </div>
      <div class="form-footer">
        <span class="char-count" id="charCount">0 / 500</span>
        <button type="submit">投稿する</button>
      </div>
    </form>
  </div>

  <div class="list-panel">
    <div class="list-heading">
      <h2>みんなの投稿</h2>
      <span class="list-count" id="listCount">0件</span>
    </div>
    <div id="postList"></div>
  </div>

  <footer>投稿はこのブラウザのlocalStorageに保存されます（この端末だけで表示されます）</footer>
</main>

<script>
  const STORAGE_KEY = "bbs_posts";

  function loadPosts() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch (e) {
      return [];
    }
  }

  function savePosts(posts) {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(posts));
    } catch (e) {}
  }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  function formatDate(ts) {
    const d = new Date(ts);
    const pad = (n) => String(n).padStart(2, "0");
    return `${d.getFullYear()}/${d.getMonth() + 1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
  }

  function renderPosts() {
    const posts = loadPosts();
    const list = document.getElementById("postList");
    const count = document.getElementById("listCount");
    list.innerHTML = "";
    count.textContent = `${posts.length}件`;

    if (posts.length === 0) {
      list.innerHTML = '<div class="empty">まだ投稿がありません。最初のひとことをどうぞ。</div>';
      return;
    }

    posts
      .slice()
      .sort((a, b) => b.timestamp - a.timestamp)
      .forEach((post) => {
        const div = document.createElement("div");
        div.className = "post";
        div.innerHTML = `
          <div class="post-header">
            <span class="post-name">${escapeHtml(post.name || "名無しさん")}</span>
            <span class="post-date">${formatDate(post.timestamp)}</span>
          </div>
          <div class="post-message">${escapeHtml(post.message)}</div>
          <button class="delete-btn" data-id="${post.id}">削除</button>
        `;
        list.appendChild(div);
      });

    list.querySelectorAll(".delete-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        const id = btn.getAttribute("data-id");
        const remaining = loadPosts().filter((p) => String(p.id) !== id);
        savePosts(remaining);
        renderPosts();
      });
    });
  }

  const messageInput = document.getElementById("message");
  const charCount = document.getElementById("charCount");

  messageInput.addEventListener("input", () => {
    charCount.textContent = `${messageInput.value.length} / 500`;
  });

  document.getElementById("postForm").addEventListener("submit", (e) => {
    e.preventDefault();
    const nameInput = document.getElementById("name");
    const message = messageInput.value.trim();
    if (!message) return;

    const posts = loadPosts();
    posts.push({
      id: Date.now() + "-" + Math.random().toString(36).slice(2, 8),
      name: nameInput.value.trim(),
      message: message,
      timestamp: Date.now(),
    });
    savePosts(posts);

    nameInput.value = "";
    messageInput.value = "";
    charCount.textContent = "0 / 500";
    renderPosts();
  });

  renderPosts();
</script>
