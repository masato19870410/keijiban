<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>みんなの掲示板</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #eef1f5;
    --surface: #ffffff;
    --hero-from: #0f3a63;
    --hero-to: #14507f;
    --ink: #16233a;
    --ink-soft: #4c5b73;
    --muted: #8592a6;
    --border: #dde3ec;
    --accent: #14507f;
    --accent-strong: #0d3a5f;
    --accent-soft: #e5eef8;
    --danger: #b3492f;
    --shadow: rgba(15, 40, 70, 0.10);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0d1420;
      --surface: #161f2e;
      --hero-from: #0a2540;
      --hero-to: #0f3a5f;
      --ink: #e8edf5;
      --ink-soft: #aeb9cc;
      --muted: #78859c;
      --border: #263145;
      --accent: #5b9bd6;
      --accent-strong: #7fb2e2;
      --accent-soft: #1b2c42;
      --danger: #d97a5f;
      --shadow: rgba(0, 0, 0, 0.35);
    }
  }

  :root[data-theme="dark"] {
    --bg: #0d1420;
    --surface: #161f2e;
    --hero-from: #0a2540;
    --hero-to: #0f3a5f;
    --ink: #e8edf5;
    --ink-soft: #aeb9cc;
    --muted: #78859c;
    --border: #263145;
    --accent: #5b9bd6;
    --accent-strong: #7fb2e2;
    --accent-soft: #1b2c42;
    --danger: #d97a5f;
    --shadow: rgba(0, 0, 0, 0.35);
  }

  * { box-sizing: border-box; }

  html {
    -webkit-text-size-adjust: 100%;
  }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Noto Sans JP", -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: clamp(20px, 6vw, 40px) clamp(12px, 4vw, 20px) 60px;
  }

  main {
    width: 100%;
    max-width: 640px;
  }

  .hero {
    background: linear-gradient(135deg, var(--hero-from), var(--hero-to));
    border-radius: 20px 20px 0 0;
    padding: clamp(28px, 8vw, 40px) clamp(18px, 5vw, 32px) clamp(64px, 14vw, 88px);
    text-align: center;
    color: #f2f6fc;
  }

  .hero h1 {
    font-weight: 800;
    font-size: clamp(1.5rem, 5.5vw, 1.9rem);
    letter-spacing: 0.02em;
    text-wrap: balance;
    margin: 0 0 10px;
  }

  .hero p {
    margin: 0;
    font-size: clamp(0.82rem, 2.6vw, 0.92rem);
    color: #c7d8ec;
    line-height: 1.6;
  }

  .panel {
    background: var(--surface);
    border-radius: 18px;
    box-shadow: 0 12px 28px var(--shadow);
    margin: clamp(-44px, -10vw, -56px) clamp(10px, 3vw, 20px) 0;
    padding: clamp(18px, 5vw, 24px);
    position: relative;
    z-index: 1;
  }

  .panel h2 {
    font-weight: 700;
    font-size: 1.05rem;
    color: var(--accent);
    margin: 0 0 18px;
  }

  .field {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .field + .field {
    margin-top: 16px;
  }

  label {
    font-size: 0.82rem;
    font-weight: 500;
    color: var(--ink-soft);
  }

  input, textarea {
    width: 100%;
    padding: 11px 14px;
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 1rem;
    font-family: inherit;
    background: var(--surface);
    color: var(--ink);
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }

  input::placeholder, textarea::placeholder {
    color: var(--muted);
  }

  input:focus, textarea:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }

  textarea {
    resize: vertical;
    min-height: 84px;
    line-height: 1.55;
  }

  .form-footer {
    display: flex;
    flex-wrap: wrap;
    justify-content: flex-end;
    align-items: center;
    margin-top: 16px;
  }

  .char-count {
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.74rem;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    margin-right: auto;
  }

  button {
    padding: 12px 26px;
    background: var(--accent);
    color: #f2f7fc;
    border: none;
    border-radius: 10px;
    font-size: 0.95rem;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    transition: background 0.15s ease;
    min-height: 44px;
    flex: 1 1 auto;
  }

  button:hover {
    background: var(--accent-strong);
  }

  button:focus-visible, input:focus-visible, textarea:focus-visible, .delete-btn:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .list-panel {
    background: var(--surface);
    border-radius: 18px;
    box-shadow: 0 12px 28px var(--shadow);
    margin: 16px clamp(10px, 3vw, 20px) 0;
    padding: clamp(18px, 5vw, 24px);
  }

  .list-heading {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 16px;
  }

  .list-heading h2 {
    font-weight: 700;
    font-size: 1.05rem;
    color: var(--accent);
    margin: 0;
  }

  .list-count {
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.78rem;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }

  #postList {
    display: flex;
    flex-direction: column;
  }

  .post {
    padding: 16px 0;
    border-bottom: 1px solid var(--border);
    animation: rise 0.25s ease;
  }

  .post:last-child {
    border-bottom: none;
    padding-bottom: 0;
  }

  .post:first-child {
    padding-top: 0;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (prefers-reduced-motion: reduce) {
    .post { animation: none; }
  }

  .post-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
    margin-bottom: 6px;
  }

  .post-name {
    font-weight: 700;
    color: var(--accent);
    overflow-wrap: anywhere;
  }

  .post-date {
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.72rem;
    color: var(--muted);
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }

  .post-message {
    white-space: pre-wrap;
    word-break: break-word;
    line-height: 1.65;
    color: var(--ink);
    margin-bottom: 8px;
  }

  .empty, .status-message {
    text-align: center;
    color: var(--muted);
    padding: 36px 20px;
    font-size: 0.9rem;
  }

  .status-message.is-error {
    color: var(--danger);
  }

  footer {
    margin-top: 24px;
    text-align: center;
    font-size: 0.75rem;
    color: var(--muted);
  }

  button:disabled {
    opacity: 0.6;
    cursor: default;
  }

  .hidden {
    display: none;
  }

  .auth-hint {
    font-size: 0.85rem;
    color: var(--ink-soft);
    line-height: 1.6;
    margin: 0 0 16px;
  }

  .logged-in-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-bottom: 16px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border);
    font-size: 0.85rem;
    color: var(--ink-soft);
    overflow-wrap: anywhere;
  }

  .link-button {
    background: none;
    border: none;
    color: var(--accent);
    font-size: 0.82rem;
    font-family: inherit;
    font-weight: 700;
    cursor: pointer;
    padding: 0;
    white-space: nowrap;
    flex: none;
  }

  .link-button:hover {
    text-decoration: underline;
  }

  .auth-divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 18px 0;
    color: var(--muted);
    font-size: 0.78rem;
  }

  .auth-divider::before, .auth-divider::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  .google-button {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 11px 20px;
    background: var(--surface);
    color: var(--ink);
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 0.92rem;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    min-height: 44px;
    transition: background 0.15s ease, border-color 0.15s ease;
  }

  .google-button:hover {
    background: var(--bg);
    border-color: var(--accent);
  }
</style>

<main>
  <div class="hero">
    <h1>みんなの掲示板</h1>
    <p>名前とひとことを投稿すると、下の一覧に新しい順で表示されます</p>
  </div>

  <div class="panel">
    <div id="authLoggedOut">
      <h2>ログインして投稿する</h2>
      <p class="auth-hint">メールアドレスにログイン用リンクが届きます。クリックすると投稿できるようになります。</p>
      <div class="field">
        <label for="authEmail">メールアドレス</label>
        <input type="email" id="authEmail" placeholder="you@example.com" required>
      </div>
      <div class="form-footer">
        <span class="char-count" id="authStatus"></span>
        <button type="button" id="sendLinkButton">ログインリンクを送る</button>
      </div>

      <div class="auth-divider"><span>または</span></div>

      <button type="button" id="googleLoginButton" class="google-button">
        <svg viewBox="0 0 18 18" width="18" height="18" aria-hidden="true">
          <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.9c1.7-1.57 2.7-3.88 2.7-6.62z"/>
          <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.8.54-1.84.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.96v2.33A9 9 0 0 0 9 18z"/>
          <path fill="#FBBC05" d="M3.95 10.7A5.4 5.4 0 0 1 3.67 9c0-.59.1-1.17.28-1.7V4.97H.96A9 9 0 0 0 0 9c0 1.45.35 2.83.96 4.03l2.99-2.33z"/>
          <path fill="#EA4335" d="M9 3.58c1.32 0 2.5.46 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .96 4.97l2.99 2.33C4.66 5.17 6.65 3.58 9 3.58z"/>
        </svg>
        Googleでログイン
      </button>
    </div>

    <div id="authLoggedIn" class="hidden">
      <div class="logged-in-bar">
        <span id="loggedInEmail"></span>
        <button type="button" id="logoutButton" class="link-button">ログアウト</button>
      </div>
      <h2>投稿する</h2>
      <form id="postForm">
        <div class="field">
          <label for="name">お名前</label>
          <input type="text" id="name" maxlength="30" placeholder="例：たろう">
        </div>
        <div class="field">
          <label for="message">ひとこと</label>
          <textarea id="message" maxlength="500" placeholder="今日できたこと・感想など" required></textarea>
        </div>
        <div class="form-footer">
          <span class="char-count" id="charCount">0 / 500</span>
          <button type="submit">投稿する</button>
        </div>
      </form>
    </div>
  </div>

  <div class="list-panel">
    <div class="list-heading">
      <h2>みんなの投稿</h2>
      <span class="list-count" id="listCount">0件</span>
    </div>
    <div id="postList"></div>
  </div>

  <footer>投稿にはメール認証が必要です。閲覧は誰でもできます。投稿内容はSupabase（クラウドDB）に保存されます</footer>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
  const SUPABASE_URL = "https://mqkuoygyatyalkynhauj.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_HONnw8Vn6XJAL94OaySFhw_RFmawq1Y";

  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const postForm = document.getElementById("postForm");
  const nameInput = document.getElementById("name");
  const messageInput = document.getElementById("message");
  const charCount = document.getElementById("charCount");
  const submitButton = postForm.querySelector("button[type=submit]");
  const list = document.getElementById("postList");
  const count = document.getElementById("listCount");

  const authLoggedOut = document.getElementById("authLoggedOut");
  const authLoggedIn = document.getElementById("authLoggedIn");
  const authEmailInput = document.getElementById("authEmail");
  const authStatus = document.getElementById("authStatus");
  const sendLinkButton = document.getElementById("sendLinkButton");
  const googleLoginButton = document.getElementById("googleLoginButton");
  const loggedInEmail = document.getElementById("loggedInEmail");
  const logoutButton = document.getElementById("logoutButton");

  function updateAuthUI(session) {
    if (session && session.user) {
      authLoggedOut.classList.add("hidden");
      authLoggedIn.classList.remove("hidden");
      loggedInEmail.textContent = `ログイン中：${session.user.email}`;
      if (!nameInput.value) {
        nameInput.value = session.user.email.split("@")[0];
      }
    } else {
      authLoggedOut.classList.remove("hidden");
      authLoggedIn.classList.add("hidden");
    }
  }

  const REDIRECT_URL = window.location.origin + window.location.pathname;
  let cooldownTimer = null;

  function startCooldown(seconds) {
    let remaining = seconds;
    sendLinkButton.disabled = true;
    sendLinkButton.textContent = `送信できるまで ${remaining} 秒`;
    clearInterval(cooldownTimer);
    cooldownTimer = setInterval(() => {
      remaining -= 1;
      if (remaining <= 0) {
        clearInterval(cooldownTimer);
        sendLinkButton.disabled = false;
        sendLinkButton.textContent = "ログインリンクを送る";
        return;
      }
      sendLinkButton.textContent = `送信できるまで ${remaining} 秒`;
    }, 1000);
  }

  function describeAuthError(error) {
    const msg = (error && error.message) || "";
    if (error && error.status === 429 || /rate limit/i.test(msg)) {
      return "送信回数の上限に達しました。1分ほど待ってからもう一度お試しください。";
    }
    if (/invalid/i.test(msg) && /email/i.test(msg)) {
      return "メールアドレスの形式が正しくありません。";
    }
    return msg ? `送信に失敗しました（${msg}）` : "送信に失敗しました。時間をおいてお試しください。";
  }

  sendLinkButton.addEventListener("click", async () => {
    const email = authEmailInput.value.trim();
    if (!email) return;

    sendLinkButton.disabled = true;
    authStatus.textContent = "送信中…";

    const { error } = await sb.auth.signInWithOtp({
      email,
      options: { emailRedirectTo: REDIRECT_URL },
    });

    if (error) {
      authStatus.textContent = describeAuthError(error);
      sendLinkButton.disabled = false;
      console.error(error);
      return;
    }

    authStatus.textContent = "リンクを送りました。メールを確認してください。";
    startCooldown(60);
  });

  googleLoginButton.addEventListener("click", async () => {
    const { error } = await sb.auth.signInWithOAuth({
      provider: "google",
      options: { redirectTo: REDIRECT_URL },
    });

    if (error) {
      authStatus.textContent = describeAuthError(error);
      console.error(error);
    }
  });

  logoutButton.addEventListener("click", async () => {
    await sb.auth.signOut();
  });

  sb.auth.onAuthStateChange((_event, session) => {
    updateAuthUI(session);
  });

  sb.auth.getSession().then(({ data }) => {
    updateAuthUI(data.session);
  });

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  function formatDate(iso) {
    const d = new Date(iso);
    const pad = (n) => String(n).padStart(2, "0");
    return `${d.getFullYear()}/${d.getMonth() + 1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
  }

  function renderPosts(posts) {
    list.innerHTML = "";
    count.textContent = `${posts.length}件`;

    if (posts.length === 0) {
      list.innerHTML = '<div class="empty">まだ投稿がありません。最初のひとことをどうぞ。</div>';
      return;
    }

    posts.forEach((post) => {
      const div = document.createElement("div");
      div.className = "post";
      div.innerHTML = `
        <div class="post-header">
          <span class="post-name">${escapeHtml(post.name || "名無しさん")}</span>
          <span class="post-date">${formatDate(post.created_at)}</span>
        </div>
        <div class="post-message">${escapeHtml(post.body)}</div>
      `;
      list.appendChild(div);
    });
  }

  function renderError(message) {
    list.innerHTML = `<div class="status-message is-error">${escapeHtml(message)}</div>`;
    count.textContent = "";
  }

  async function loadPosts() {
    list.innerHTML = '<div class="status-message">読み込み中…</div>';
    const { data, error } = await sb
      .from("messages")
      .select("id, name, body, created_at")
      .order("created_at", { ascending: false });

    if (error) {
      renderError("投稿の読み込みに失敗しました。時間をおいて再読み込みしてください。");
      console.error(error);
      return;
    }

    renderPosts(data);
  }

  messageInput.addEventListener("input", () => {
    charCount.textContent = `${messageInput.value.length} / 500`;
  });

  postForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    const body = messageInput.value.trim();
    if (!body) return;

    submitButton.disabled = true;
    submitButton.textContent = "投稿中…";

    const { error } = await sb.from("messages").insert({
      name: nameInput.value.trim() || null,
      body: body,
    });

    submitButton.disabled = false;
    submitButton.textContent = "投稿する";

    if (error) {
      alert("投稿に失敗しました。時間をおいてもう一度お試しください。");
      console.error(error);
      return;
    }

    nameInput.value = "";
    messageInput.value = "";
    charCount.textContent = "0 / 500";
    loadPosts();
  });

  loadPosts();

  sb
    .channel("messages-changes")
    .on("postgres_changes", { event: "INSERT", schema: "public", table: "messages" }, () => {
      loadPosts();
    })
    .subscribe();
</script>
